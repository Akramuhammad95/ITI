<button
class="create-btn"
(click)="openModal()">

Create Post

</button>

@if(isOpen()){

<div class="overlay">

    <div class="modal">

        <h2>Create Post</h2>

        <input
        [(ngModel)]="title"
        placeholder="Title">

        <input
        [(ngModel)]="category"
        placeholder="Category">

        <textarea
        [(ngModel)]="description"
        placeholder="Description">
        </textarea>

        <div class="buttons">

            <button
            (click)="savePost()">

                Save

            </button>

            <button
            (click)="closeModal()">

                Cancel

            </button>

        </div>

    </div>

</div>

}
