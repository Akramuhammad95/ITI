<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Form</title>

<style>
  /* Body & layout */
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }

  /* Form style */
  form {
    background: white;
    padding: 30px;
    border-radius: 16px;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    text-align: center;
  }

  input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
  }

  button {
    background: #2575fc;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #1a5be0;
  }

  /* Gender images */
  .gender-container {
    display: flex;
    justify-content: space-around;
    margin-top: 15px;
  }

  .gender-container img {
    width: 80px;
    border-radius: 12px;
    transition: 0.3s;
    border: 3px solid transparent;
    cursor: pointer;
  }

  input[type="radio"] {
    display: none;
  }

  input[type="radio"]:checked + img {
    border-color: #2575fc;
    transform: scale(1.1);
  }

  /* Output */
  #output {
    display: none;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    gap: 20px;
    animation: fadeIn 0.6s ease;
    text-align: left;
  }

  #output img {
    width: 120px;
    border-radius: 50%;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }

  #message {
    font-size: 18px;
    font-weight: 600;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<form id="userForm">
  <input type="text" id="name" placeholder="Enter your name" required><br>
  <input type="number" id="age" placeholder="Enter your age" required><br>

  <p>Select Gender:</p>
  <div class="gender-container">
    <label>
      <input type="radio" name="gender" value="male" required>
      <img src="male.jpg" alt="Male">
    </label>
    <label>
      <input type="radio" name="gender" value="female">
      <img src="female.jpeg" alt="Female">
    </label>
  </div>

  <select id="color">
    <option value="red">Red</option>
    <option value="blue">Blue</option>
    <option value="green">Green</option>
    <option value="purple">Purple</option>
    <option value="orange">Orange</option>
  </select><br>

  <button type="submit">Submit</button>
</form>

<!-- Output section -->
<div id="output">
  <img id="genderImage" src="">
  <div id="message"></div>
</div>

<script src="script.js"></script>
</body>
</html>
