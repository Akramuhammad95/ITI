<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fade Out Image</title>


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #d5d9e8, #06918A);
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;   
      max-width: 400px;
      width: 90%;
    }

    .card h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .fade-img {
      width: 30%;
      border-radius: 300px;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .fade-img:hover {
      opacity: 0.4;        
      transform: scale(1.05);
    }
    h2 {
      text-align: center;
      margin-bottom: 100px;
      color: #333;
      padding-right: 20px;
    }
  </style>
</head>
<body>

  <h2>A to Z Academy</h2>
    <img class="fade-img" src="MAIN LOGO LIGHT (SOLID).png" alt="image">


</body>
</html>
