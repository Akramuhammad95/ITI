<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f6f8;
      }

      .container {
        width: 350px;
        margin: 100px auto;
        padding: 20px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      label {
        display: inline-block;
        width: 80px;
        font-weight: bold;
      }

      input {
        width: 220px;
        padding: 6px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      input:focus {
        outline: none;
        border-color: #007bff;
      }

      button {
        width: 100%;
        padding: 8px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <form action="" method="GET">
        <label for="nameInput">Name</label>
        <input
          id="nameInput"
          type="text"
          placeholder="Enter your name"
          name="name"
        /><br /><br />

        <label for="emailInput">Email</label>
        <input
          id="emailInput"
          type="email"
          placeholder="Enter your email"
          name="email"
        /><br /><br />

        <label for="passwordInput">Password</label>
        <input
          id="passwordInput"
          type="password"
          placeholder="Enter your password"
          name="password"
        /><br /><br />

        <button type="submit">Register</button>
      </form>
    </div>

    <script>
      // A01
      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });
      // A02
      document.forms.item(0).addEventListener("submit", (event) => {
        let choice = confirm(
          "Are you sure you want to submit the form? Press OK to submit, or Cancel to stay on the page.",
        );
        if (!choice) {
          event.preventDefault();
        } else {
          alert("Form submitted successfully!");
        }
      });
      //A03
      const input = document.getElementById("nameInput");
      let timer;
      const custEvent = new CustomEvent("custEvent", {
        detail: {
          message: "No data entered after 3 seconds",
        },
      });
      function startTimer() {
        timer = setTimeout(() => {
          input.dispatchEvent(custEvent);
        }, 3000);
      }
      startTimer();
      input.addEventListener("input", () => {
        clearTimeout(timer);
        startTimer();
      });
      input.addEventListener("custEvent", (e) => {
        alert(e.detail.message);
        startTimer();
      });
    </script>
  </body>
</html>
