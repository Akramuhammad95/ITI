      document.addEventListener("keydown", (e) => {
        console.log(e.key)
        if (
          (e.ctrlKey || e.altKey || e.shiftKey) &&
          !["Control", "Shift", "Alt"].includes(e.key)
        ) {
          e.preventDefault();
        }
      });
