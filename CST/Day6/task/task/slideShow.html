<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Show</title>
    <style>
      #slideShow {
        width: 500px;
        height: 300px;
        position: relative;
        overflow: hidden;
      }
      .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: none;
      }
      button {
        width: 100px;
        margin-top: 10px;
        background-color: aqua; border: 1 solid black;
      }
      .slide.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="slideShow">
        <img
          src="/TaskResources/SlideShow/1.jpg"
          alt="Slide 1"
          class="slide active"
        />
        <img src="/TaskResources/SlideShow/2.jpg" alt="Slide 2" class="slide" />
        <img src="/TaskResources/SlideShow/3.jpg" alt="Slide 3" class="slide" />
        <img src="/TaskResources/SlideShow/4.jpg" alt="Slide 4" class="slide" />
        <img src="/TaskResources/SlideShow/5.jpg" alt="Slide 5" class="slide" />
        <img src="/TaskResources/SlideShow/6.jpg" alt="Slide 5" class="slide" />
      </div>
      <div class="controls">
        <button id="prevBtn" onclick="prevSlide()">Previous</button>
        <button id="nextBtn" onclick="nextSlide()">Next</button>
        <button onclick="slideshow()">SlideShow</button>
        <button onclick="stopSlideshow()">Stop</button>
      </div>
    </div>
    <script>
      let currentSlide = 0;
      const slides = document.querySelectorAll(".slide");
      let slideInterval;

      function showSlide(index) {
        slides.forEach((slide, i) => {
          slide.classList.toggle("active", i === index);
        });
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === slides.length - 1;
      }

      function nextSlide() {
        if (currentSlide < slides.length - 1) {
          currentSlide++;
          showSlide(currentSlide);
        }
      }

      function prevSlide() {
        if (currentSlide > 0) {
          currentSlide--;
          showSlide(currentSlide);
        }
      }

      function slideshow() {
        slideInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % slides.length;
          showSlide(currentSlide);
        }, 700);
      }

      function stopSlideshow() {
        clearInterval(slideInterval);
      }
    </script>
  </body>
</html>
